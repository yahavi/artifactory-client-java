resources:
  - name: yahavJavaClientSnapshotGit
    type: GitRepo
    configuration:
      path: jfrog/artifactory-client-java
      gitProvider: il_automation
      branches:
        include: dev

  - name: yahavJavaClientReleaseGit
    type: GitRepo
    configuration:
      path: jfrog/artifactory-client-java
      gitProvider: il_automation
      buildOn:
        commit: false
      branches:
        include: master
